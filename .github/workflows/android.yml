name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - index.html
      - android-app/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The signing key lives in android-app/release.keystore so every build can update the
      # installed app without losing scans. To keep the password private, add a repository
      # secret named ANDROID_KEYSTORE_PASSWORD with the same value and delete the fallback below.
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'HD8pAf_iY6UJGULwMgy_VBGj' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Prepare web files (works offline, no CDN)
        working-directory: android-app
        run: |
          mkdir -p www
          cp ../index.html www/index.html
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/jspdf.umd.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#' www/index.html
          grep -q 'src="jspdf.umd.min.js"' www/index.html

      - name: Create Android project
        working-directory: android-app
        run: |
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: App icon and splash screen
        working-directory: android-app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2F6BFF' --iconBackgroundColorDark '#2F6BFF' --splashBackgroundColor '#0F1316' --splashBackgroundColorDark '#0F1316'

      - name: Sync and build
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        working-directory: android-app
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias docscan --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../DocScanPro.apk aligned.apk
          "$BT/apksigner" verify ../DocScanPro.apk
          ls -la ../DocScanPro.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: DocScan Pro for Android 1.0.${{ github.run_number }}
          make_latest: true
          files: DocScanPro.apk
          body: |
            Download **DocScanPro.apk** below and open it on your Android phone.
            If Android asks, allow installing apps from your browser or file manager.
            Installing a newer version over an older one keeps your scans.
